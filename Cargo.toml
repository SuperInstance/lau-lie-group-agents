[package]
name = "lau-lie-group-agents"
version = "0.1.0"
edition = "2021"
description = "Lie group theory for agents: SO(n), SU(n), GL(n), Sp(2n), SE(3), Lie algebras, exponential map, BCH, adjoint representation, structure constants, Killing form, root systems, Peter-Weyl"
license = "MIT"

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-complex = "0.4"
